[package]
name = "amphi"
version = "0.1.0"
edition = "2021"
description = "Amphi — notes de cours"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Liaison a whisper.cpp. Metal sur Apple Silicon, CPU ailleurs — c'est ce qui
# permet a chaque etudiant de transcrire chez lui a vitesse native.
whisper-rs = { version = "0.14", default-features = false, features = ["metal"] }
ureq = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# La compilation par defaut de Rust est lente a l'execution ; on optimise le
# binaire livre, la transcription en depend directement.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
