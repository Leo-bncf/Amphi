name: Desktop bundles
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare desktop frontend
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          cp -R apps/studio/ui/. apps/desktop/dist/
          test -s apps/desktop/dist/vendor/mermaid.min.js
          test -s apps/desktop/dist/vendor/katex/katex.min.js
          test -s apps/desktop/dist/vendor/fonts/fonts.css
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build macOS bundle
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: amphi-macos
          path: apps/desktop/src-tauri/target/release/bundle/**
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare desktop frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/dist | Out-Null
          Copy-Item apps/studio/ui/index.html apps/desktop/dist/index.html
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2 --locked
      - name: Build Windows bundle
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: amphi-windows
          path: apps/desktop/src-tauri/target/release/bundle/**

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: amphi-macos
          path: release/macos
      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: amphi-windows
          path: release/windows
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print)
          test "${#assets[@]}" -gt 0
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Amphi $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
