name: Desktop bundles
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare desktop frontend
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          cp apps/studio/ui/index.html apps/desktop/dist/index.html
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build macOS bundle
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: amphi-macos
          path: apps/desktop/src-tauri/target/release/bundle/**
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare desktop frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/desktop/dist | Out-Null
          Copy-Item apps/studio/ui/index.html apps/desktop/dist/index.html
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2 --locked
      - name: Build Windows bundle
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: amphi-windows
          path: apps/desktop/src-tauri/target/release/bundle/**
